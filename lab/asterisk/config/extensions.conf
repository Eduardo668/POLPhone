[general]
static=yes
writeprotect=yes
clearglobalvars=yes

[globals]
LAB_CONTEXT=from-lab

[from-lab]
; Somente extensões locais explícitas. Não há curingas, troncos ou rotas externas.
exten => 600,1,NoOp(POLPHONE_LAB_AUDIO extension=600 uniqueid=${UNIQUEID} channel=${CHANNEL(name)})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Chamadas opcionais entre os dois peers fictícios chan_sip.
exten => 1001,1,Dial(SIP/1001,30)
 same => n,Hangup()
exten => 1002,1,Dial(SIP/1002,30)
 same => n,Hangup()

; Coletor genérico: preserva o modo auto configurado no peer.
exten => 9999,1,Answer()
 same => n,Set(LAB_METHOD=auto)
 same => n,Goto(lab-collect,s,1)

; Testes controlados. SIPDtmfMode pertence ao chan_sip em Asterisk 20.
exten => 9991,1,Answer()
 same => n,SIPDtmfMode(rfc2833)
 same => n,Set(LAB_METHOD=rfc2833)
 same => n,Goto(lab-collect,s,1)

exten => 9992,1,Answer()
 same => n,SIPDtmfMode(info)
 same => n,Set(LAB_METHOD=info)
 same => n,Goto(lab-collect,s,1)

exten => 9993,1,Answer()
 same => n,SIPDtmfMode(inband)
 same => n,Set(LAB_METHOD=inband)
 same => n,Goto(lab-collect,s,1)

exten => i,1,NoOp(POLPHONE_LAB_REJECT reason=invalid-extension value=${INVALID_EXTEN})
 same => n,Hangup()

[lab-collect]
exten => s,1,NoOp(POLPHONE_LAB_COLLECTOR method=${LAB_METHOD} codec=${CHANNEL(audioreadformat)} uniqueid=${UNIQUEID} channel=${CHANNEL(name)})
 same => n(collect),Set(DIGIT=)
 same => n,Read(DIGIT,beep,1,,1,10)
 same => n,NoOp(POLPHONE_LAB_DTMF method=${LAB_METHOD} digit=${DIGIT} readstatus=${READSTATUS} uniqueid=${UNIQUEID} channel=${CHANNEL(name)} codec=${CHANNEL(audioreadformat)})
 same => n,GotoIf($["${READSTATUS}"="OK" & "${DIGIT}"!=""]?accepted:timeout)
 same => n(accepted),SayDigits(${DIGIT})
 same => n,Wait(1)
 same => n,Goto(collect)
 same => n(timeout),PlayTones(congestion)
 same => n,Wait(1)
 same => n,StopPlayTones()
 same => n,Hangup()
